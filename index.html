<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DineIn - Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #fafaf9 0%, #f5f5f4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1c1917;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.05) 0%, rgba(20, 184, 166, 0.05) 100%);
            z-index: 1;
        }

        .container {
            text-align: center;
            max-width: 600px;
            padding: 2rem;
            position: relative;
            z-index: 2;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .logo-image {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            box-shadow: 0 4px 14px 0 rgba(249, 115, 22, 0.15);
        }

        .logo-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }

        .subtitle {
            font-size: 0.875rem;
            color: #14b8a6;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 0.25rem;
        }

        .main-title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            color: #1c1917;
            text-shadow: none;
        }

        .description {
            font-size: 1.125rem;
            margin-bottom: 3rem;
            color: #57534e;
            line-height: 1.7;
            font-weight: 400;
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }

        .countdown-item {
            background: rgba(255, 255, 255, 0.9);
            padding: 1.5rem;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(249, 115, 22, 0.1);
            min-width: 80px;
            box-shadow: 0 4px 14px 0 rgba(249, 115, 22, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .countdown-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px 0 rgba(249, 115, 22, 0.15);
        }

        .countdown-number {
            font-size: 2rem;
            font-weight: 800;
            display: block;
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .countdown-label {
            font-size: 0.75rem;
            color: #57534e;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-top: 0.5rem;
        }

        .email-signup {
            margin-bottom: 2rem;
        }

        .email-form {
            display: flex;
            gap: 1rem;
            max-width: 400px;
            margin: 0 auto;
            flex-wrap: wrap;
        }

        .email-input {
            flex: 1;
            padding: 1rem 1.5rem;
            border: 2px solid rgba(249, 115, 22, 0.1);
            border-radius: 50px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.9);
            color: #1c1917;
            min-width: 250px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            font-family: inherit;
        }

        .email-input:focus {
            outline: none;
            border-color: #f97316;
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.1);
        }

        .email-input::placeholder {
            color: #78716c;
        }

        .notify-btn {
            padding: 1rem 2rem;
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            white-space: nowrap;
            font-family: inherit;
            box-shadow: 0 4px 14px 0 rgba(249, 115, 22, 0.25);
        }

        .notify-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px 0 rgba(249, 115, 22, 0.35);
        }

        .notify-btn:active {
            transform: translateY(0);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .social-link {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #f97316;
            transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(249, 115, 22, 0.1);
            box-shadow: 0 4px 14px 0 rgba(249, 115, 22, 0.08);
        }

        .social-link:hover {
            transform: translateY(-2px);
            background: rgba(249, 115, 22, 0.1);
            box-shadow: 0 8px 25px 0 rgba(249, 115, 22, 0.15);
        }

        .floating-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        .shape:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 20%;
            left: 10%;
            animation-delay: -2s;
        }

        .shape:nth-child(2) {
            width: 120px;
            height: 120px;
            top: 60%;
            right: 10%;
            animation-delay: -4s;
        }

        .shape:nth-child(3) {
            width: 60px;
            height: 60px;
            top: 70%;
            left: 20%;
            animation-delay: -1s;
        }

        .shape:nth-child(4) {
            width: 100px;
            height: 100px;
            top: 10%;
            right: 20%;
            animation-delay: -3s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        @media (max-width: 768px) {
            .main-title {
                font-size: 2rem;
            }

            .logo {
                font-size: 2rem;
            }

            .logo-container {
                gap: 0.75rem;
            }

            .logo-image {
                width: 50px;
                height: 50px;
                font-size: 1.25rem;
            }

            .countdown {
                gap: 1rem;
            }

            .countdown-item {
                padding: 1rem;
                min-width: 60px;
            }

            .countdown-number {
                font-size: 1.5rem;
            }

            .email-form {
                flex-direction: column;
                align-items: center;
            }

            .email-input {
                min-width: 100%;
            }

            .container {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <div class="container">
        <div class="logo-container">
            <div class="logo-image">🍽️</div>
            <div class="logo-text">
                <div class="logo">DineIn</div>
                <div class="subtitle">Lunch Deals</div>
            </div>
        </div>
        
        <h1 class="main-title">Coming Soon</h1>
        <p class="description">
            We're cooking up something special! Get ready for the ultimate platform to discover and book exclusive lunch deals from the best restaurants in Bucharest.
        </p>

        <div class="countdown" id="countdown">
            <div class="countdown-item">
                <span class="countdown-number" id="days">30</span>
                <span class="countdown-label">Days</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-number" id="hours">12</span>
                <span class="countdown-label">Hours</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-number" id="minutes">45</span>
                <span class="countdown-label">Minutes</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-number" id="seconds">30</span>
                <span class="countdown-label">Seconds</span>
            </div>
        </div>

        <div class="email-signup">
            <form class="email-form" onsubmit="handleEmailSignup(event)">
                <input 
                    type="email" 
                    class="email-input" 
                    placeholder="Enter your email for early access"
                    required
                    id="email"
                >
                <button type="submit" class="notify-btn">Notify Me</button>
            </form>
        </div>

        <div class="social-links">
            <a href="#" class="social-link" title="Facebook">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                </svg>
            </a>
            <a href="#" class="social-link" title="Twitter">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"/>
                </svg>
            </a>
            <a href="#" class="social-link" title="Instagram">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                </svg>
            </a>
        </div>
    </div>

    <script>
        // Countdown Timer
        function updateCountdown() {
            // Option 1: Set a specific launch date (recommended for production)
            // const launchDate = new Date('2025-07-01T12:00:00'); // July 1st, 2025 at noon
            
            // Option 2: Set launch date relative to current time (for demo)
            const launchDate = new Date();
            launchDate.setDate(launchDate.getDate() + 30); // 30 days from now
            launchDate.setHours(12, 0, 0, 0); // Set to noon for consistency
            
            // Option 3: For quick testing - set to 2 minutes from now (uncomment to test)
            // const launchDate = new Date();
            // launchDate.setTime(launchDate.getTime() + (2 * 60 * 1000)); // 2 minutes from now
            
            const now = new Date().getTime();
            const distance = launchDate.getTime() - now;

            // Calculate time units
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Update the display with padding for consistent formatting
            const daysElement = document.getElementById('days');
            const hoursElement = document.getElementById('hours');
            const minutesElement = document.getElementById('minutes');
            const secondsElement = document.getElementById('seconds');

            if (daysElement) daysElement.textContent = Math.max(0, days).toString().padStart(2, '0');
            if (hoursElement) hoursElement.textContent = Math.max(0, hours).toString().padStart(2, '0');
            if (minutesElement) minutesElement.textContent = Math.max(0, minutes).toString().padStart(2, '0');
            if (secondsElement) secondsElement.textContent = Math.max(0, seconds).toString().padStart(2, '0');

            // Check if countdown has finished
            if (distance < 0) {
                const countdownElement = document.getElementById('countdown');
                if (countdownElement) {
                    countdownElement.innerHTML = '<h2 style="color: #f97316; font-size: 2rem; margin: 2rem 0;">🎉 We\'re Live! 🎉</h2>';
                }
                // Clear the interval when countdown reaches zero
                clearInterval(window.countdownInterval);
            }
        }

        // Start the countdown timer
        window.countdownInterval = setInterval(updateCountdown, 1000);
        updateCountdown(); // Initial call to set values immediately

        // Email signup handler
        function handleEmailSignup(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            
            // Store email in localStorage (in a real app, you'd send this to your backend)
            let emails = JSON.parse(localStorage.getItem('comingSoonEmails') || '[]');
            if (!emails.includes(email)) {
                emails.push(email);
                localStorage.setItem('comingSoonEmails', JSON.stringify(emails));
            }
            
            // Show success message
            const button = event.target.querySelector('.notify-btn');
            const originalText = button.textContent;
            button.textContent = 'Thanks! 🎉';
            button.style.background = 'linear-gradient(135deg, #14b8a6 0%, #0d9488 100%)';
            
            setTimeout(() => {
                button.textContent = originalText;
                button.style.background = 'linear-gradient(135deg, #f97316 0%, #ea580c 100%)';
                document.getElementById('email').value = '';
            }, 2000);
        }

        // Add some interactive animations
        document.addEventListener('mousemove', (e) => {
            const shapes = document.querySelectorAll('.shape');
            const mouseX = e.clientX / window.innerWidth;
            const mouseY = e.clientY / window.innerHeight;

            shapes.forEach((shape, index) => {
                const speed = (index + 1) * 0.5;
                const x = (mouseX - 0.5) * speed;
                const y = (mouseY - 0.5) * speed;
                shape.style.transform = `translate(${x}px, ${y}px)`;
            });
        });
    </script>
</body>
</html>
